services:
  agent:
    image: mpholley/mike-factory:latest
    restart: unless-stopped
    volumes:
      - agent-data:/data
    # Portainer writes the stack's environment variables to stack.env.
    env_file: stack.env
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.services.mike-factory.loadbalancer.server.port=3000
      - traefik.http.middlewares.mike-factory-auth.basicauth.users=${BASIC_AUTH_USERS:?}
      - traefik.http.routers.mike-factory.rule=Host(`${MIKE_FACTORY_HOST:?}`)
      - traefik.http.routers.mike-factory.entrypoints=websecure
      - traefik.http.routers.mike-factory.tls.certresolver=letsencrypt
      - traefik.http.routers.mike-factory.middlewares=mike-factory-auth
      # GitHub can't send basic auth; the app verifies the webhook's HMAC signature instead.
      - traefik.http.routers.mike-factory-webhook.rule=Host(`${MIKE_FACTORY_HOST:?}`) && Path(`/webhooks/github`)
      - traefik.http.routers.mike-factory-webhook.priority=100
      - traefik.http.routers.mike-factory-webhook.entrypoints=websecure
      - traefik.http.routers.mike-factory-webhook.tls.certresolver=letsencrypt

volumes:
  agent-data:

networks:
  traefik:
    external: true
