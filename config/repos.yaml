owner: michaelholley
allowedSenderId: 47337897
defaults:
  model: { provider: openrouter, modelId: openai/gpt-6.1-sol }
  thinkingLevel: high
  maxTurns: 60
  maxCostUsd: 3
  maxFixAttempts: 2
repos:
  - name: byok-imagen
    defaultBranch: main
    setup: pnpm install --frozen-lockfile
    checks: [pnpm lint, pnpm check]
  - name: Tshopper
    defaultBranch: main
    setup: pnpm install --frozen-lockfile
    checks: [pnpm run lint, pnpm run check]
  - name: mike-factory
    defaultBranch: main
    setup: pnpm install --frozen-lockfile
    checks: [pnpm lint, pnpm format:check, pnpm typecheck, pnpm test]
  - name: zone-0
    defaultBranch: main
    setup: pnpm install --frozen-lockfile
    checks: [pnpm run lint, pnpm run check]
