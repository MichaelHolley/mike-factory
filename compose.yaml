services:
  agent:
    image: ${DOCKERHUB_USER:-mpholley}/mike-factory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - agent-data:/data
    # Portainer writes the stack's environment variables to stack.env.
    env_file: stack.env
    networks:
      proxy:
        aliases: [mike-factory]

volumes:
  agent-data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}
