services:
  agent:
    image: ${DOCKERHUB_USER:-mpholley}/mike-factory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - agent-data:/data
    # Portainer writes the stack's environment variables to stack.env.
    env_file: stack.env

volumes:
  agent-data:
